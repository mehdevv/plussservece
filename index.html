<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pluss.dev — Sites Fast, CRM, ERP et IA | Algérie</title>
    <meta
      name="description"
      content="Systèmes personnalisés : site web Fast, CRM, ERP et IA pour les entreprises en Algérie. Appel gratuit."
    />
    <meta property="og:title" content="Quatre systèmes, conçus autour de votre entreprise — Fast, CRM, ERP, IA" />
    <meta
      property="og:description"
      content="Sites personnalisés en 3 jours, plus CRM, ERP et IA calés sur votre façon de travailler."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/logo.png" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var stored = localStorage.getItem("pluss-lang");
        var arabic =
          stored === "ar" ||
          (stored !== "fr" && String(navigator.language || "").toLowerCase().indexOf("ar") === 0);
        document.documentElement.lang = arabic ? "ar" : "fr";
        document.documentElement.dir = arabic ? "rtl" : "ltr";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
